services:
  - type: web
    name: chinese-diary
    runtime: node
    plan: free
    buildCommand: echo "no build needed"
    startCommand: node app/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PUBLIC_MODE
        value: "1"
      # 아래 키는 Render 화면에서 직접 입력합니다(파일에 적지 않습니다). 둘 중 하나만 넣으세요.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # 번역 횟수 제한(원하면 Render 화면에서 바꿀 수 있습니다)
      - key: LIMIT_PER_IP_HOUR
        value: "10"
      - key: LIMIT_PER_DAY
        value: "100"
