<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 시안 3가지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --page: #e9e7e2; --ink: #1d1d1d; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--page); color: var(--ink); font-family: "Noto Sans KR", sans-serif; padding: 28px 16px 60px; }
  h1 { font-size: 1.5rem; text-align: center; }
  .lead { text-align: center; color: #555; margin: 8px auto 28px; max-width: 640px; line-height: 1.6; font-size: .95rem; }
  .dir { max-width: 1240px; margin: 0 auto 44px; }
  .dir-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .dir-head b { font-size: 1.25rem; }
  .dir-head span { color: #666; font-size: .9rem; }
  .refs { color: #666; font-size: .85rem; margin-bottom: 14px; line-height: 1.5; }
  .row { display: flex; gap: 22px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
  .cap { text-align: center; font-size: .8rem; color: #666; margin-top: 8px; }
  .row > div { flex: 0 0 300px; }
  .phone { width: 100%; height: 620px; border-radius: 34px; border: 8px solid #111; overflow: hidden; position: relative; scroll-snap-align: start; background: var(--bg); color: var(--tx); font-family: var(--font-ui); display: flex; flex-direction: column; }
  .scr { flex: 1; padding: 16px 16px 0; overflow: hidden; position: relative; }
  .status { height: 22px; display: flex; justify-content: space-between; font-size: .66rem; padding: 6px 18px 0; color: var(--tx); opacity: .7; }
  .hz { font-family: "Noto Serif SC", serif; }
  .py { font-family: -apple-system, "Helvetica Neue", sans-serif; }
  .tabs { display: flex; justify-content: space-around; padding: 8px 6px 14px; font-size: .62rem; }
  .tabs i { display: block; width: 22px; height: 22px; margin: 0 auto 3px; border-radius: 7px; background: currentColor; opacity: .25; }
  .tabs .on i { opacity: 1; }
  .tabs div { text-align: center; color: var(--mute); }
  .tabs .on { color: var(--pri); font-weight: 700; }

  /* ---------- A. 플레이풀 스터디 ---------- */
  .A { --bg: #ffffff; --tx: #3c3c3c; --mute: #9aa0a6; --pri: #5b5bf0; --pri-d: #4343c9; --ok: #2dbe60; --ok-d: #1f9a4a; --bad: #f0524f; --font-ui: "Nunito", "Noto Sans KR", sans-serif; }
  .A .tabs { border-top: 2px solid #e5e5e5; }
  .A .chip { display: inline-flex; gap: 6px; align-items: center; background: #fff4e0; color: #e58a00; font-weight: 800; border-radius: 99px; padding: 5px 11px; font-size: .78rem; }
  .A .top { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 18px; }
  .A .top h1 { font-size: 1.05rem; font-weight: 800; color: var(--pri); text-align: left; }
  .A h2 { font-size: 1.45rem; font-weight: 800; line-height: 1.25; margin-bottom: 10px; }
  .A .sub { color: #777; font-size: .85rem; line-height: 1.5; margin-bottom: 14px; }
  .A .box { border: 2px solid #e5e5e5; border-radius: 18px; padding: 14px; min-height: 150px; font-size: .95rem; line-height: 1.7; background: #fafafa; }
  .A .btn { display: block; width: 100%; text-align: center; font-weight: 800; letter-spacing: .02em; padding: 13px; border-radius: 16px; background: var(--pri); color: #fff; box-shadow: 0 4px 0 var(--pri-d); margin-top: 16px; font-size: .95rem; }
  .A .btn.sm { display: inline-block; width: auto; padding: 9px 16px; margin: 0 8px 0 0; font-size: .82rem; box-shadow: 0 3px 0 var(--pri-d); }
  .A .btn.ghost { background: #fff; color: var(--pri); border: 2px solid #e5e5e5; box-shadow: 0 3px 0 #e5e5e5; }
  .A .card { border: 2px solid #e5e5e5; border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 #e5e5e5; }
  .A .ko { color: #9aa0a6; font-size: .8rem; margin-bottom: 8px; font-weight: 700; }
  .A .words { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 6px 0 14px; }
  .A .w { text-align: center; padding: 2px 4px; border-radius: 10px; }
  .A .w .py { display: block; font-size: .66rem; color: var(--pri); font-weight: 700; }
  .A .w .hz { font-size: 1.7rem; line-height: 1.3; }
  .A .w.sel { background: #e8e8ff; box-shadow: 0 -2px 0 inset var(--pri); }
  .A .mini { position: absolute; left: 10px; right: 10px; bottom: 66px; background: #fff; border: 2px solid #e5e5e5; border-radius: 20px; padding: 12px 14px; box-shadow: 0 4px 0 #e5e5e5, 0 12px 24px rgba(0,0,0,.12); }
  .A .mini .t { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .A .mini .hz { font-size: 1.6rem; } .A .mini .m { font-size: 1.1rem; font-weight: 800; }
  .A .prog { height: 14px; background: #e5e5e5; border-radius: 9px; overflow: hidden; margin: 6px 0 22px; }
  .A .prog i { display: block; height: 100%; width: 40%; background: var(--ok); border-radius: 9px; box-shadow: 0 -4px 0 rgba(255,255,255,.3) inset; }
  .A .q { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
  .A .big { text-align: center; margin: 18px 0 20px; }
  .A .big .hz { font-size: 3rem; } .A .big .py { color: var(--pri); font-weight: 700; display: block; font-size: .9rem; }
  .A .opt { border: 2px solid #e5e5e5; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; font-weight: 700; box-shadow: 0 3px 0 #e5e5e5; font-size: .95rem; }
  .A .opt.ok { border-color: var(--ok); background: #e6f8ec; color: var(--ok-d); box-shadow: 0 3px 0 var(--ok); }
  .A .fb { position: absolute; left: 0; right: 0; bottom: 0; background: #e6f8ec; padding: 14px 16px 16px; color: var(--ok-d); font-weight: 800; }
  .A .fb .btn { background: var(--ok); box-shadow: 0 4px 0 var(--ok-d); margin-top: 10px; }

  /* ---------- B. 차분한 저널 ---------- */
  .B { --bg: #faf9f6; --tx: #1b1b1b; --mute: #8a867f; --pri: #b8322a; --font-ui: "Noto Sans KR", sans-serif; }
  .B .top { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 26px; font-size: .78rem; color: var(--mute); }
  .B .top h1 { font-family: "Noto Serif KR", serif; font-size: .95rem; font-weight: 600; color: var(--tx); text-align: left; letter-spacing: .02em; }
  .B .chip { font-size: .74rem; color: var(--mute); }
  .B h2 { font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 1.7rem; line-height: 1.35; margin-bottom: 18px; }
  .B h2 em { font-style: normal; color: var(--pri); }
  .B .sub { display: none; }
  .B .box { font-family: "Noto Serif KR", serif; font-size: 1.02rem; line-height: 2; min-height: 200px; border: 0; border-top: 1px solid #ddd8cf; border-bottom: 1px solid #ddd8cf; padding: 14px 0; }
  .B .btn { display: block; text-align: center; background: var(--tx); color: #fff; border-radius: 99px; padding: 13px; margin-top: 18px; font-size: .9rem; font-weight: 500; }
  .B .btn.sm { display: inline-block; padding: 8px 15px; margin: 0 6px 0 0; font-size: .78rem; }
  .B .btn.ghost { background: transparent; color: var(--tx); border: 1px solid var(--tx); }
  .B .tabs { position: absolute; left: 22px; right: 22px; bottom: 14px; padding: 9px 8px; border-radius: 99px; background: rgba(255,255,255,.72); backdrop-filter: blur(14px); border: 1px solid rgba(0,0,0,.08); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
  .B .tabs i { background: none; border: 1.5px solid currentColor; opacity: .5; border-radius: 50%; width: 18px; height: 18px; }
  .B .tabs .on i { background: var(--pri); border-color: var(--pri); }
  .B .card { padding: 4px 0 18px; border-bottom: 1px solid #ddd8cf; }
  .B .ko { font-family: "Noto Serif KR", serif; color: var(--mute); font-size: .86rem; margin-bottom: 14px; }
  .B .words { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 6px 0 16px; }
  .B .w { text-align: center; }
  .B .w .py { display: block; font-size: .64rem; color: var(--mute); }
  .B .w .hz { font-size: 2.1rem; line-height: 1.3; }
  .B .w.sel .hz { color: var(--pri); border-bottom: 2px solid var(--pri); }
  .B .mini { position: absolute; left: 14px; right: 14px; bottom: 74px; background: rgba(255,255,255,.86); backdrop-filter: blur(16px); border: 1px solid rgba(0,0,0,.08); border-radius: 22px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
  .B .mini .t { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .B .mini .hz { font-size: 1.7rem; } .B .mini .m { font-family: "Noto Serif KR", serif; font-size: 1.1rem; }
  .B .prog { height: 2px; background: #ddd8cf; margin: 6px 0 30px; } .B .prog i { display: block; height: 100%; width: 40%; background: var(--pri); }
  .B .q { font-family: "Noto Serif KR", serif; font-size: 1.05rem; color: var(--mute); text-align: center; }
  .B .big { text-align: center; margin: 24px 0 30px; } .B .big .hz { font-size: 3.4rem; } .B .big .py { display: block; color: var(--mute); font-size: .9rem; }
  .B .opt { padding: 14px 4px; border-top: 1px solid #ddd8cf; font-family: "Noto Serif KR", serif; font-size: 1rem; }
  .B .opt.ok { color: var(--pri); font-weight: 700; }
  .B .opt.ok::after { content: "  ✓"; }
  .B .fb { position: absolute; left: 18px; right: 18px; bottom: 76px; color: var(--mute); font-size: .86rem; text-align: center; }
  .B .fb .btn { margin-top: 12px; }

  /* ---------- C. 톤온톤 카드 ---------- */
  .C { --bg: #eef6f4; --tx: #14302b; --mute: #5d7a74; --pri: #0f6b5c; --cont: #cfe8e1; --tert: #f6c453; --font-ui: "Noto Sans KR", sans-serif; }
  .C .top { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 18px; }
  .C .top h1 { font-size: 1.1rem; font-weight: 800; text-align: left; }
  .C .chip { background: var(--tert); color: #4a3500; border-radius: 99px; padding: 5px 12px; font-weight: 800; font-size: .76rem; }
  .C h2 { font-size: 1.9rem; font-weight: 800; line-height: 1.2; margin-bottom: 14px; letter-spacing: -.02em; }
  .C .sub { display: none; }
  .C .box { background: #fff; border-radius: 28px; padding: 18px; min-height: 190px; font-size: .98rem; line-height: 1.8; }
  .C .btn { display: block; text-align: center; background: var(--pri); color: #fff; font-weight: 800; border-radius: 99px; padding: 15px; margin-top: 14px; font-size: .95rem; }
  .C .btn.sm { display: inline-block; padding: 9px 16px; margin: 0 6px 0 0; font-size: .8rem; }
  .C .btn.ghost { background: var(--cont); color: var(--pri); }
  .C .tabs { background: #fff; margin: 0 10px 10px; border-radius: 28px; padding: 10px 6px; }
  .C .tabs .on i { background: var(--pri); border-radius: 14px; width: 40px; }
  .C .tabs i { width: 40px; height: 24px; border-radius: 14px; }
  .C .card { background: #fff; border-radius: 28px; padding: 18px; }
  .C .ko { background: var(--cont); display: inline-block; border-radius: 99px; padding: 5px 12px; font-size: .78rem; font-weight: 700; margin-bottom: 12px; color: var(--pri); }
  .C .words { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 4px 0 14px; }
  .C .w { text-align: center; padding: 3px 5px; border-radius: 14px; }
  .C .w .py { display: block; font-size: .64rem; color: var(--mute); font-weight: 500; }
  .C .w .hz { font-size: 1.8rem; line-height: 1.3; }
  .C .w.sel { background: var(--tert); }
  .C .mini { position: absolute; left: 10px; right: 10px; bottom: 76px; background: var(--pri); color: #fff; border-radius: 28px; padding: 14px 16px; }
  .C .mini .t { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .C .mini .hz { font-size: 1.7rem; } .C .mini .m { font-weight: 800; font-size: 1.1rem; }
  .C .mini .btn { background: #fff; color: var(--pri); }
  .C .mini .btn.ghost { background: rgba(255,255,255,.18); color: #fff; }
  .C .prog { height: 10px; background: #fff; border-radius: 9px; margin: 4px 0 20px; } .C .prog i { display: block; height: 100%; width: 40%; background: var(--pri); border-radius: 9px; }
  .C .q { font-weight: 800; font-size: 1.15rem; }
  .C .big { background: var(--cont); border-radius: 28px; text-align: center; padding: 22px 0; margin: 12px 0 14px; } .C .big .hz { font-size: 3rem; } .C .big .py { display: block; color: var(--pri); font-weight: 700; font-size: .9rem; }
  .C .opt { background: #fff; border-radius: 20px; padding: 13px 16px; margin-bottom: 8px; font-weight: 700; font-size: .95rem; }
  .C .opt.ok { background: var(--pri); color: #fff; }
  .C .fb { position: absolute; left: 10px; right: 10px; bottom: 8px; background: var(--tert); color: #4a3500; border-radius: 28px; padding: 14px 16px; font-weight: 800; }
  .C .fb .btn { background: var(--pri); }
  .dirs { display: flex; flex-direction: column; }
  .pick { background: #fff; border-radius: 14px; padding: 14px 18px; max-width: 760px; margin: 0 auto 30px; font-size: .9rem; line-height: 1.7; }
</style>
</head>
<body>
<h1>강의 중국어 다이어리 · 디자인 시안 3가지</h1>
<p class="lead">같은 내용(일기 한 줄 → 번역 → 단어 카드 → 퀴즈)을 세 방향으로 그렸습니다. 가로로 넘기며 비교해 보세요. 한국어·병음·한자는 실제 앱과 같은 구성입니다.</p>
<div class="pick"><b>보는 법</b> · 각 방향마다 ① 일기 쓰기 ② 번역 결과 + 단어 카드 ③ 퀴즈 화면입니다. 색·글꼴·버튼 모양·여백이 어떻게 달라지는지 봐 주세요.</div>
<div class="dirs" id="root"></div>
<script>
const dirs = [
  { c: 'A', name: 'A · 플레이풀 스터디', tag: '공부하는 맛이 나는 학습 앱', refs: '참고: Duolingo(굵은 둥근 버튼·진행 막대·연속 일수), HelloChinese(친근한 학습 흐름)' },
  { c: 'B', name: 'B · 차분한 저널', tag: '글쓰기가 중심인 조용한 일기장', refs: '참고: Day One·Apple Journal(빈 종이 같은 쓰기 화면), iOS 유리 질감 하단 바' },
  { c: 'C', name: 'C · 톤온톤 카드', tag: '또렷한 색 면으로 나눈 현대적 앱', refs: '참고: Material 3 Expressive(큰 둥근 면·색 대비), Pleco(정보 밀도 높은 사전 카드)' },
];
const tabs = (on) => `<div class="tabs">${['쓰기','번역','일기장','보관함','설정'].map((t,i)=>`<div class="${i===on?'on':''}"><i></i>${t}</div>`).join('')}</div>`;
const status = '<div class="status"><span>9:41</span><span>● ● ▮</span></div>';
const s1 = (c) => `${status}<div class="scr"><div class="top"><h1>강의 중국어 다이어리</h1><span class="chip">${c==='A'?'🔥 3일 연속':c==='C'?'3일 연속':'10월 19일 · 3일째'}</span></div>
  <h2>${c==='B'?'오늘 하루,<br><em>어땠나요?</em>':'오늘 하루,<br>어땠나요?'}</h2><p class="sub">한국어로 일기를 쓰면 초급 중국어로 옮겨 드려요.</p>
  <div class="box">오늘은 아침에 빗소리를 들으며 깼다. 기분 좋은 시작이다. 커피를 마시면서 창밖을 한참 바라봤다.</div>
  <div class="btn">번역하고 공부하기</div></div>${tabs(0)}`;
const s2 = (c) => `${status}<div class="scr"><div class="top"><h1>번역</h1><span class="chip">문장 1 / 3</span></div>
  <div class="card"><div class="ko">오늘은 날씨가 좋다.</div>
  <div class="words">${[['jīn','今'],['tiān','天'],['qì','气'],['hěn','很'],['hǎo','好']].map(([p,h],i)=>`<div class="w ${i===1||i===2?'sel':''}"><span class="py">${p}</span><span class="hz">${h}</span></div>`).join('')}</div>
  <span class="btn sm">▶ 듣기</span><span class="btn sm ghost">☆ 문장 저장</span></div></div>
  <div class="mini"><div class="t"><div class="hz">天气</div><div class="m">날씨</div></div><span class="btn sm">▶ 듣기</span><span class="btn sm ghost">☆ 단어장</span><span class="btn sm ghost">자세히</span></div>${tabs(1)}`;
const s3 = (c) => `${status}<div class="scr"><div class="prog"><i></i></div><div class="q">${c==='B'?'이 단어의 뜻은?':'이 단어의 뜻을 고르세요'}</div>
  <div class="big"><span class="py">tiān qì</span><span class="hz">天气</span></div>
  <div class="opt">오늘</div><div class="opt ok">날씨</div><div class="opt">좋다</div></div>
  <div class="fb">${c==='B'?'정답이에요. 天气 — 날씨':'정답이에요! 🎉'}<div class="btn">계속</div></div>`;
const caps = ['① 일기 쓰기', '② 번역 결과 + 단어 카드', '③ 퀴즈'];
document.getElementById('root').innerHTML = dirs.map((d) => `<section class="dir"><div class="dir-head"><b>${d.name}</b><span>${d.tag}</span></div><p class="refs">${d.refs}</p>
  <div class="row">${[s1,s2,s3].map((f,i)=>`<div><div class="phone ${d.c}">${f(d.c)}</div><div class="cap">${caps[i]}</div></div>`).join('')}</div></section>`).join('');
</script>
</body>
</html>
